<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Nome</title>
</head>
<body> 
    <h1 id="titulo">...</h1>

    <input type="text" id="inputNome" placeholder="Digite seu nome">
    <button onclick="enviarNome()">Enviar</button>

    <script>
        // Busca inicial do nome
        fetch('http://localhost:8000/mensagem')
            .then(response => response.json())
            .then(data => {
                document.querySelector("#titulo").innerHTML = data.mensagem;
            });

        function enviarNome() {
            const nome = document.querySelector("#inputNome").value;

            fetch('http://localhost:8000/alterar_nome', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ nome: nome })
            })
            .then(response => response.json())
            .then(data => {
                document.querySelector("#titulo").innerHTML = data.mensagem;
            })
            .catch(error => console.error("Erro:", error));
        }
    </script>
</body>
</html>
