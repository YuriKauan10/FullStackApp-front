<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Nome</title>
</head>
<body> 
    <h1 id="usuario">Usuário: </h1>
    <h1 id="produto">Produto: </h1>
    <h1 id="mensagem">Mensagem: </h1>

    <input type="text" id="inputNome" placeholder="Digite: nome, produto, mensagem">
    <button onclick="enviarNome()">Enviar</button>

    <a href="index.html">Voltar</a>

    <script>
        function enviarNome() {
            const valor = document.getElementById("inputNome").value;
            const partes = valor.split(",").map(item => item.trim());

            if (partes.length !== 3) {
                alert("Digite exatamente: nome, produto, mensagem");
                return;
            }

            const [usuario, produto, mensagem] = partes;

            fetch("http://localhost:8000/enviar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    usuario: usuario,
                    produto: produto,
                    mensagem: mensagem
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro na conexão com a API");
                }
                return response.json();
            })
            .then(data => {
                // Atualiza a página com os dados recebidos, somente se a resposta for bem-sucedida
                document.getElementById("usuario").innerHTML = "Usuário: " + data.usuario;
                document.getElementById("produto").innerHTML = "Produto: " + data.produto;
                document.getElementById("mensagem").innerHTML = "Mensagem: " + data.mensagem;
            })
            .catch(error => {
                console.error("Erro:", error);
                alert("Erro ao conectar com a API. Tente novamente.");
                // Opcional: Limpa os valores da página se a conexão falhar
                document.getElementById("usuario").innerHTML = "Usuário: Não disponível";
                document.getElementById("produto").innerHTML = "Produto: Não disponível";
                document.getElementById("mensagem").innerHTML = "Mensagem: Não disponível";
            });
        }
    </script>
</body>
</html>
