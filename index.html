<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo GET</title>
</head>
<body>
    <h1 id="usuario">Usuário: </h1>
    <h1 id="produto">Produto: </h1>
    <h1 id="mensagem">Mensagem: </h1>

    <a href="index2.html">
        <button>Clique</button>
    </a>

    <script>
        // Acessar o usuário
        fetch('http://localhost:8000/usuario')
            .then(response => response.json())
            .then(data => {
                document.querySelector("#usuario").innerHTML = "Usuário: " + data.usuario;
            })
            .catch(error => console.error("Erro ao buscar usuário:", error));

        // Acessar o produto
        fetch('http://localhost:8000/produto')
            .then(response => response.json())
            .then(data => {
                document.querySelector("#produto").innerHTML = "Produto: " + data.produto;
            })
            .catch(error => console.error("Erro ao buscar produto:", error));

        // Acessar a mensagem
        fetch('http://localhost:8000/mensagem')
            .then(response => response.json())
            .then(data => {
                document.querySelector("#mensagem").innerHTML = "Mensagem: " + data.mensagem;
            })
            .catch(error => console.error("Erro ao buscar mensagem:", error));
    </script>
</body>
</html>
